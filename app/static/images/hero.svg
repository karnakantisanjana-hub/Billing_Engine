<svg width="100%" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Subscription billing hero illustration</title>
<desc>An abstract illustration of a gold coin surrounded by a teal recurring-cycle arrow, with tilted invoice cards and soft geometric accents.</desc>
<defs>
