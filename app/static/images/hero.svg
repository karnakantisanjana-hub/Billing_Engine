<stop offset="0%" stop-color="#D4B483"/>
<stop offset="100%" stop-color="#9A7B49"/>
</linearGradient>
<marker id="arrowT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#2F6B62" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<circle cx="120" cy="90" r="60" fill="#EFE6D8" opacity="0.6"/>
<circle cx="590" cy="440" r="80" fill="#E4EFED" opacity="0.6"/>
