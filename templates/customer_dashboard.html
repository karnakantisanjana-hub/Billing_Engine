<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Portal | BillingEngine</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
<style>
    body { background: #fdf7f0; color: #2B2927; padding: 40px; font-family: 'Poppins', sans-serif; }
    .header { display: flex; justify-content: space-between; margin-bottom: 28px; }
    .header h1{ font-size:30px; font-family:'Cormorant Garamond',serif; }

    .tab-nav{ display:flex; gap:10px; margin-bottom:24px; }
    .tab-nav button{
        padding:12px 22px;
        border-radius:50px;
        border:none;
        background:#F4ECE2;
        color:#8A8478;
        font-weight:600;
        font-size:13px;
        cursor:pointer;
    }
    .tab-nav button.active{ background:#B89A69; color:#fff; }

    .glass-panel { background: rgba(255,255,255,.35); backdrop-filter: blur(18px); border-radius: 24px; padding: 28px; box-shadow: 12px 12px 25px rgba(0,0,0,.07); margin-bottom: 20px;}
    .btn-signout { padding: 12px 24px; border-radius: 50px; background: #F4ECE2; color: #C0432A; border: none; cursor: pointer; font-weight: 600; }

    .badge { padding: 6px 14px; border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
    .badge-active { background: #E3F0E3; color: #3F9142; }
    .badge-cancelled { background: #FBE6E1; color: #C0432A; }
    .badge-trial { background: #EFE6D8; color: #9A7B49; }
    .badge-paused { background: #EFEBE3; color: #6B6455; }
    .badge-past_due { background: #F8EAD6; color: #B8792B; }

    .action-btn {
        padding: 8px 16px; border-radius: 12px; border: none; cursor: pointer;
        font-weight: 600; background: #B89A69; color: white;
        margin-top: 10px; margin-right: 8px; font-size: 13px;
    }
    .action-btn.secondary { background: #EFEBE3; color: #6B4F2A; }
    .action-btn.danger { background: #F4DAD1; color: #C0432A; }

    .plan-select {
        padding: 8px 12px; border-radius: 10px; border: 1px solid #E4DDC9;
        margin-top: 10px; margin-right: 8px; font-family: 'Poppins', sans-serif; font-size: 13px;
    }

    .sub-card { border-bottom: 1px solid #e4ddc9; padding: 18px 0; }
    .sub-card:last-child { border-bottom: none; }

    label{ display:block; font-size:12px; color:#9A7B49; font-weight:600; margin-bottom:8px; text-transform:uppercase; }
    input{
        width:100%; max-width:420px; padding:12px 16px; border-radius:12px; border:none;
        background:#F8F2EB; box-shadow:inset 2px 2px 5px rgba(0,0,0,.05), inset -2px -2px 5px white;
        margin-bottom:16px; font-family:'Poppins',sans-serif; font-size:14px; outline:none;
    }

    .tab-panel{ display:none; }
    .tab-panel.active{ display:block; }

    .toast{
        position:fixed; bottom:28px; right:28px; padding:14px 20px; border-radius:12px;
        font-size:13px; font-weight:600; color:#fff; display:none; z-index:100;
    }
    .toast.show{ display:block; }
    .toast.success{ background:#3F9142; }
    .toast.error{ background:#C0432A; }
</style>
</head>
<body>

<div class="header">
    <div>
        <h1>Customer Portal</h1>
        <p>Welcome back, <span id="customerName">Loading...</span></p>
    </div>
    <div>
        <button class="btn-signout" onclick="logout()">Sign Out</button>
    </div>
</div>

<div class="tab-nav">
    <button class="active" onclick="switchTab('subscriptions', this)">My Subscriptions</button>
    <button onclick="switchTab('profile', this)">My Profile</button>
</div>

<div id="subscriptions" class="tab-panel active">
    <div class="glass-panel">
        <h2>My Subscriptions</h2>
        <div id="subscriptionsList">
            <p>Loading your subscriptions...</p>
        </div>
    </div>
</div>

<div id="profile" class="tab-panel">
    <div class="glass-panel" style="max-width:500px;">
        <h2>General Info</h2>
        <label>Full Name</label>
        <input type="text" id="profileName">
        <label>Email</label>
        <input type="email" id="profileEmail" disabled style="opacity:0.6;">
        <label>Company Name</label>
        <input type="text" id="profileCompany">
        <button class="action-btn" onclick="saveProfile()">Save Changes</button>
    </div>

    <div class="glass-panel" style="max-width:500px;">
        <h2>Change Password</h2>
        <label>Current Password</label>
        <input type="password" id="currentPassword">
        <label>New Password</label>
        <input type="password" id="newPassword">
        <label>Confirm New Password</label>
        <input type="password" id="confirmPassword">
        <button class="action-btn" onclick="changePassword()">Update Password</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    const token = localStorage.getItem('customer_access_token');

    if (!token) {
        window.location.href = '/customer/login';
    }

    let availablePlans = [];

    function switchTab(tabId, btn){
        document.querySelectorAll('.tab-panel').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-nav button').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    }

    function showToast(message, type='success'){
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = 'toast show ' + type;
        setTimeout(() => { toast.className = 'toast'; }, 3000);
    }

    async function loadAvailablePlans() {
        try {
            const res = await fetch('/api/v1/customer/portal/plans', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) {
                availablePlans = await res.json();
            }
        } catch (error) {
            console.error('Error loading plans:', error);
        }
    }

    function planOptionsHtml(currentPlanId) {
        return availablePlans
            .filter(p => p.id !== currentPlanId)
            .map(p => `<option value="${p.id}">${p.name} — $${p.price}</option>`)
            .join('');
    }

    let currentProfile = null;

    async function loadCustomerData() {
        try {
            const profileRes = await fetch('/api/v1/customer/portal/profile', {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (profileRes.status === 401) {
                logout();
                return;
            }

            currentProfile = await profileRes.json();
            document.getElementById('customerName').innerText = currentProfile.name;
            document.getElementById('profileName').value = currentProfile.name || '';
            document.getElementById('profileEmail').value = currentProfile.email || '';
            document.getElementById('profileCompany').value = currentProfile.company_name || '';

            const subsRes = await fetch('/api/v1/customer/portal/subscriptions', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const subs = await subsRes.json();

            const subsList = document.getElementById('subscriptionsList');
            if (subs.length === 0) {
                subsList.innerHTML = '<p>You have no active subscriptions.</p>';
                return;
            }

            subsList.innerHTML = subs.map(sub => {
                const status = sub.status.toLowerCase();
                let actionButtons = '';

                if (status === 'active') {
                    actionButtons += `<button class="action-btn secondary" onclick="pauseSubscription(${sub.id})">Pause</button>`;
                }
                if (status === 'paused') {
                    actionButtons += `<button class="action-btn" onclick="resumeSubscription(${sub.id})">Resume</button>`;
                }
                if (status !== 'cancelled') {
                    actionButtons += `<button class="action-btn danger" onclick="cancelSubscription(${sub.id})">Cancel</button>`;
                }

                const changePlanBlock = status !== 'cancelled' ? `
                    <div style="margin-top:12px;">
                        <select class="plan-select" id="planSelect-${sub.id}">
                            <option value="">-- Switch to plan --</option>
                            ${planOptionsHtml(sub.plan_id)}
                        </select>
                        <button class="action-btn secondary" onclick="changePlan(${sub.id})">Change Plan</button>
                    </div>
                ` : '';

                return `
                    <div class="sub-card">
                        <h3 style="margin-bottom: 5px;">Plan ID: ${sub.plan_id}</h3>
                        <p style="margin-bottom: 10px;">Status: <span class="badge badge-${status}">${sub.status}</span></p>
                        <p style="font-size: 13px; color: #666; margin-bottom: 10px;">Started: ${new Date(sub.start_date).toLocaleDateString()}</p>
                        <div>${actionButtons}</div>
                        ${changePlanBlock}
                    </div>
                `;
            }).join('');

        } catch (error) {
            console.error('Error loading data:', error);
            showToast('Failed to load portal data', 'error');
        }
    }

    async function postAction(subId, action) {
        try {
            const res = await fetch(`/api/v1/customer/portal/subscriptions/${subId}/${action}`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });

            if (res.ok) {
                showToast(`Subscription ${action}d successfully`);
                loadCustomerData();
            } else {
                const err = await res.json();
                showToast(err.detail || 'Action failed', 'error');
            }
        } catch (error) {
            console.error(`Error on ${action}:`, error);
        }
    }

    function pauseSubscription(subId) { postAction(subId, 'pause'); }
    function resumeSubscription(subId) { postAction(subId, 'resume'); }

    async function cancelSubscription(subId) {
        if (!confirm('Are you sure you want to cancel this subscription?')) return;
        postAction(subId, 'cancel');
    }

    async function changePlan(subId) {
        const select = document.getElementById(`planSelect-${subId}`);
        const newPlanId = select.value;

        if (!newPlanId) {
            showToast('Please choose a plan to switch to', 'error');
            return;
        }

        try {
            const res = await fetch(`/api/v1/customer/portal/subscriptions/${subId}/change-plan`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ new_plan_id: parseInt(newPlanId) })
            });

            if (res.ok) {
                showToast('Plan changed successfully');
                loadCustomerData();
            } else {
                const err = await res.json();
                showToast(err.detail || 'Failed to change plan', 'error');
            }
        } catch (error) {
            console.error('Error changing plan:', error);
        }
    }

    async function saveProfile() {
        try {
            const res = await fetch('/api/v1/customer/portal/profile', {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    name: document.getElementById('profileName').value,
                    company_name: document.getElementById('profileCompany').value
                })
            });

            const data = await res.json();
            if (res.ok) {
                showToast('Profile updated successfully');
                document.getElementById('customerName').innerText = data.customer.name;
            } else {
                showToast(data.detail || 'Update failed', 'error');
            }
        } catch (error) {
            console.error('Error saving profile:', error);
        }
    }

    async function changePassword() {
        const old_password = document.getElementById('currentPassword').value;
        const new_password = document.getElementById('newPassword').value;
        const confirm_password = document.getElementById('confirmPassword').value;

        if (new_password !== confirm_password) {
            showToast('New passwords do not match', 'error');
            return;
        }

        try {
            const res = await fetch('/api/v1/customer/portal/change-password', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ old_password, new_password })
            });

            const data = await res.json();
            if (res.ok) {
                showToast('Password updated successfully');
                document.getElementById('currentPassword').value = '';
                document.getElementById('newPassword').value = '';
                document.getElementById('confirmPassword').value = '';
            } else {
                showToast(data.detail || 'Update failed', 'error');
            }
        } catch (error) {
            console.error('Error changing password:', error);
        }
    }

    function logout() {
        localStorage.removeItem('customer_access_token');
        localStorage.removeItem('customer_refresh_token');
        window.location.href = '/customer/login';
    }

    async function init() {
        await loadAvailablePlans();
        await loadCustomerData();
    }

    init();
</script>

</body>
</html>
