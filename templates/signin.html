<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In | BillingEngine</title>

    <link rel="stylesheet" href="/static/css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Cormorant+Garamond:wght@500;700&display=swap"
        rel="stylesheet">

</head>

<body class="auth-body">

<div class="bg-circle one"></div>
<div class="bg-circle two"></div>
<div class="bg-circle three"></div>

<div class="top-nav">
    <div class="brand">BillingEngine</div>
    <a href="/signup" class="login-link">
        New here? <span>Create Account</span>
    </a>
</div>

<div class="signup-wrapper">

    <div class="glass-card">

        <div class="icon-box">🔒</div>

        <h1>Welcome <span>Back</span></h1>

        <p>Sign in to manage your subscriptions and billing.</p>

        <div id="error-msg"
             style="display:none;color:red;margin-bottom:15px;">
        </div>

        <!-- FORM STARTS HERE -->
        <form id="adminLoginForm">

            <div class="input-box">
                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    required>
            </div>

            <div class="input-box">
                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required>
            </div>

            <button class="signup-btn" type="submit">
                Sign In
            </button>

        </form>
        <!-- FORM ENDS HERE -->

        <p class="secure">
            Don't have an account?
            <a href="/signup"
               style="color:#B89A69;font-weight:600;">
                Create One
            </a>
        </p>

    </div>

</div>

<script>

document.getElementById("adminLoginForm").addEventListener("submit", async function(e){

    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try{

        const response = await fetch("/api/v1/auth/login",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                email:email,
                password:password

            })

        });

        const data = await response.json();

        if(response.ok){

            localStorage.setItem("access_token",data.access_token);

            localStorage.setItem("refresh_token",data.refresh_token);

            window.location.href="/dashboard";

        }else{

            const error=document.getElementById("error-msg");

            error.style.display="block";

            error.innerText=data.detail || "Invalid Email or Password";

        }

    }catch(error){

        console.error(error);

        document.getElementById("error-msg").style.display="block";

        document.getElementById("error-msg").innerText="Server Error";

    }

});

</script>

</body>

</html>
