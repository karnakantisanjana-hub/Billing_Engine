<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Login | BillingEngine</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
<div class="signup-wrapper">
    <div class="glass-card">
        <h1>Customer <span>Portal</span></h1>
        <p>Log in to manage your personal subscriptions.</p>
        
        <div id="error-msg" style="color: red; margin-bottom: 15px; display: none;"></div>

        <form id="customerLoginForm">
            <div class="input-box">
                <input type="email" id="email" placeholder="Email Address" required>
            </div>
            <div class="input-box">
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <button class="signup-btn" type="submit">Sign In to Portal</button>
        </form>
    </div>
</div>

<script>
    document.getElementById('customerLoginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        try {
            const res = await fetch('/api/v1/customer/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            
            if (res.ok) {
                const data = await res.json();
                // Store the CUSTOMER tokens
                localStorage.setItem('customer_access_token', data.access_token);
                localStorage.setItem('customer_refresh_token', data.refresh_token);
                window.location.href = '/customer/dashboard';
            } else {
                const err = await res.json();
                const errorBox = document.getElementById('error-msg');
                errorBox.innerText = err.detail;
                errorBox.style.display = 'block';
            }
        } catch (error) {
            console.error(error);
        }
    });
</script>
</body>
</html>
